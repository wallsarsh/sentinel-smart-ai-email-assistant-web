name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint, typecheck, unit tests, send gate
        run: npm run check
      - name: Build
        run: npm run build
      - name: Secrets scan
        run: node tools/secrets-scan.mjs
      - name: Bundle size budget
        run: node tools/bundle-budget.mjs
      - name: Dependency audit
        run: node tools/audit.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: sentinel_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: End-to-end (built server, real Postgres, real browser)
        run: npm run e2e
        env:
          E2E_DATABASE_URL: postgres://postgres:pw@127.0.0.1:5432/sentinel_e2e
