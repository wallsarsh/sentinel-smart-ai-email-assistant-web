[package]
name = "sentinel-desktop"
version = "0.1.0"
description = "Sentinel AI Email Assistant desktop client"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "sentinel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
open = "5"
