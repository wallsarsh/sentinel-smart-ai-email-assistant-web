# Kubernetes manifests (plain YAML; apply with `kubectl apply -f` or include in kustomize).
# Prerequisites: a Secret named `sentinel-env` holding the variables from deploy/.env.example
# (DATABASE_URL, BASE_URL, SESSION_SECRET, KEK_BASE64, ...), an ingress/TLS of your choice in front of
# the `sentinel-web` Service, and an image pushed to your registry (replace IMAGE below).
#
# Release order (see docs/runbook.md): 1) run the migrate Job to completion, 2) roll web, 3) roll worker.
# Migrations must be backward compatible with the previous release (expand, then contract in a later release).
apiVersion: batch/v1
kind: Job
metadata:
  name: sentinel-migrate
  labels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: migrate }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: migrate }
    spec:
      restartPolicy: Never
      securityContext:
        { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: IMAGE
          command: ['node', 'dist/migrate.mjs']
          envFrom: [{ secretRef: { name: sentinel-env } }]
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-web
  labels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: web }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: web }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: IMAGE
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ secretRef: { name: sentinel-env } }]
          readinessProbe:
            { httpGet: { path: /api/ready, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe:
            {
              httpGet: { path: /api/health, port: http },
              initialDelaySeconds: 15,
              periodSeconds: 10,
            }
          startupProbe:
            { httpGet: { path: /api/health, port: http }, periodSeconds: 2, failureThreshold: 30 }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: '1', memory: 512Mi } }
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-worker
  labels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: worker }
spec:
  replicas: 1
  # Jobs are claimed with row locks, so more replicas are safe; one is enough for a small install.
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: worker }
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: IMAGE
          command: ['node', 'dist/worker.mjs']
          envFrom: [{ secretRef: { name: sentinel-env } }]
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: '1', memory: 768Mi } }
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-web
  labels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: web }
spec:
  selector: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: web }
