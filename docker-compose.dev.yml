# Local development stack: Postgres, Mailpit (SMTP sink + web UI) and GreenMail
# (IMAP/SMTP test server). Run the app on the host with `npm run dev`, or use
# the `app` service with `docker compose -f docker-compose.dev.yml --profile app up`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel-dev-only
      POSTGRES_DB: sentinel
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports: ['8025:8025', '1025:1025']

  greenmail:
    image: greenmail/standalone:2.1.2
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=alice:alice-pass@example.test,bob:bob-pass@example.test
    ports: ['3143:3143', '3025:3025']

  app:
    profiles: [app]
    build: { context: ., dockerfile: Dockerfile.dev }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sentinel:sentinel-dev-only@postgres:5432/sentinel
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ['.:/app', '/app/node_modules']

volumes:
  pgdata:
