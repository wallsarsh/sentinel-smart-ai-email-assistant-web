<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentinel — daily brief</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="page page--popup">
      <header class="topbar">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">S</span>
          <div>
            <div class="brand__name">Sentinel</div>
            <div class="brand__sub">Daily brief</div>
          </div>
        </div>
        <button id="dashboard" class="btn btn--small btn--ghost" type="button">Dashboard</button>
      </header>
      <div class="stack">
        <div class="row row--between">
          <button id="refresh" class="btn btn--primary" type="button">Refresh brief</button>
          <span id="status" class="status" role="status"></span>
        </div>
        <div id="brief" class="stack"></div>
      </div>
      <p class="footer">Updated after new mail, at most hourly. Nothing is sent.</p>
    </div>
    <script type="module" src="brief-popup.js"></script>
  </body>
</html>
