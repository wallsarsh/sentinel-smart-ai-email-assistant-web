<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px system-ui;
        width: 24rem;
        padding: 0.75rem;
      }
      pre {
        white-space: pre-wrap;
        font: inherit;
      }
      button {
        margin-right: 0.4rem;
      }
    </style>
  </head>
  <body>
    <p id="subject"></p>
    <p><button id="sum">Summarize</button><button id="reply">Draft reply</button></p>

    /></label>

    <p><button id="again" hidden>Analyze again</button></p>
    <pre id="out" role="status"></pre>
